# yaml-language-server: $schema=./schema.json
title: FPG's console showed ONE tile for 7 hours — a deploy's rollback replaced .generated/registry under four running bind mounts
opened: '2026-10-29'
category: bug
severity: high
status: in-progress
summary: |-
  From 2026-10-29 08:45:54Z until 15:47Z the FPG office (vps1, srv2085127) showed «אפליקציה אחת
  מותקנת» — only the console's own «הגדרות מסוף». Every app was running and healthy. The CHAT-81
  package's rollback (`find .generated -mindepth 1 -delete; tar -xzf …`) deleted
  `.generated/registry` and extracted a NEW directory in its place; console, dgo-extend and computers
  kept their bind mount on the deleted inode and saw an empty directory, and the console silently fell
  back to modules.yaml. Fixed live by restarting those three containers (18 tiles back); the two
  defects that let it happen are still open.
description: |
  area: console / compiled registries / deploy packages

  ## Symptom (owner, phone, 2026-10-29 17:38 local)

  Home screen: «הלשכה הדיגיטלית», «אפליקציה אחת מותקנת», one group «הגדרות» with one tile «הגדרות מסוף».

  ## Measured on vps1 (2026-10-29 ~15:45Z, through the computers share door)

  All 60 containers up; the apps were never down. Only the console's view of them was:

      host:      /opt/digital-office/fireplace/.generated/registry   inode 300901, 8 files,
                 console.modules.yaml 3681 bytes (written 08:46:05Z)
      console:   ls /app/generated                         -> (empty)
                 GET /api/modules                          -> 1 ['הגדרות מסוף']
                 /proc/<pid>/mountinfo                     -> /opt/digital-office/fireplace/.generated/registry//deleted /app/generated
                 stat /app/generated                       -> inode 262223 (the old, deleted directory)

  Same `//deleted` mount in `dgo-extend-fireplace` (/registry — its office.apps.json, the catalog
  linked offices read) and `computers-fireplace` (/registry). `connections-fireplace` was created
  before the replacement too but showed the live path — re-checked after the fix, no container has a
  deleted mount.

  ## Root cause

  Every entry of `.generated/` got ctime 2026-10-29 08:45:54Z, and `registry` a NEW inode whose mtime
  is the tarball's (2026-10-22 13:43:18.000). That second is the CHAT-81 package
  (`/root/stage-r4-platform2-20261029T084348Z/CHAT-81/`, "the recorder tile shows its mic"):

      deploy.sh   08:45:53  tar .generated -> generated-before-…084553Z.tgz; reconcile.py render;
                            the render changed something outside the registry -> restore()
      rollback.sh           find "$R/.generated" -mindepth 1 -delete      <- deletes registry/ itself
                            tar -C "$R" -xzf "$B"                          <- a NEW registry/ directory
      deploy.sh   08:46:05  ran again, rendered into the new directory, DONE

  A bind mount pins the directory INODE it was started with, not the path. deploy.sh's own header
  says "The console reads the registry through its bind mount … no container touched" — true for a
  file rewritten in place, false for a directory deleted and recreated. The console then did what
  `_modules()` does when `console.modules.yaml` is absent: served `modules.yaml` (one tile) with 200
  and a healthy healthcheck, so nothing flagged it for seven hours.

  Reproduced in this repository: the console app with `GENERATED_REGISTRY=<empty dir>` returns
  exactly `[('הגדרות מסוף', 'הגדרות')]`; with a compiled registry it adds «אפליקציות».

  Same family as ai/context/symlinked-repo-root-empty-bind-mount.md (2026-10-01): a registry bind
  mount that lands on an empty directory while the container stays healthy.

  ## Fix applied (2026-10-29 15:47–15:51Z, vps1)

  `./scripts/dc restart console`, `… dgo-extend`, `… computers` — a start re-resolves the bind source
  by path. No recreate, no compose change, no data touched. After:

      console    /api/modules -> 18 tiles (בינה ודעת, קבצים, הקלטות, מייל, … אפליקציות, … n8n); healthy
      dgo-extend /registry 8 files, no deleted mount; healthy
      computers  /registry 8 files, no deleted mount; healthy
      scan of every running container: no `//deleted` mount left

  ## Still open — why it can happen again

  1. Any restore that deletes and re-creates `.generated/registry` (the CHAT-81 rollback pattern, a
     `git clean -x`, an rm -rf + render) blinds every container mounting it. Either mount the parent
     `.generated` (whose inode a contents-restore keeps), or make restores write INTO the existing
     directory (`tar --overwrite` without deleting the directory itself), or restart the mounting
     services as the last step of any `.generated` restore.
  2. The console cannot tell "no compiled registry" from "an office with one app". A missing
     `/app/generated/console.modules.yaml` should fail the healthcheck and show a card, not a
     plausible one-tile office.

  ## Related: the tracked platform.state.yaml in this repository belongs to another office

  `platform.state.default.yaml` says `platform.state.yaml` is per-office runtime, never carried by
  git; here it is tracked and carries a `remote:` block for vps1 and another office's app set. Not the
  cause of this incident (FPG's own file is untouched, 7796 bytes, 2026-10-28), but a clone or pull on
  an office would put it in place.
tasks:
