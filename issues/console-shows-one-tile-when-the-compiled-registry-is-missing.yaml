    done: true
  - text: 'Restart console, dgo-extend, computers; /api/modules = 18; no deleted mount on any container'
    done: true
  - text: 'Make a .generated restore safe for running bind mounts (mount the parent, restore in place, or restart the mounters)'
    done: false
  - text: 'Console: a missing compiled registry fails health and says so, instead of the silent modules.yaml fallback'
    done: false
  - text: 'Fix the CHAT-81 rollback.sh pattern in the deploy-package template (do not delete registry/ itself)'
    done: false
  - text: 'Repository: stop tracking platform.state.yaml (it is per-office runtime, per platform.state.default.yaml)'
    done: false
