    done: false
  - text: 'On the FPG server: `docker inspect console-<DEPLOYMENT_NAME>` mounts — is the registry source the checkout bbox renders into?'
    done: false
  - text: 'On the FPG server: compare platform.state.yaml with FPG''s intended app set (not the vps1 office''s)'
    done: false
  - text: 'Restore: `./bbox reconcile` from that checkout, reload, confirm «אפליקציות» and the office''s apps are back'
    done: false
  - text: 'Console: make a missing compiled registry visible (API field + home-screen card + health) instead of the silent modules.yaml fallback'
    done: false
  - text: 'Repository: stop tracking platform.state.yaml (it is per-office runtime, per platform.state.default.yaml)'
    done: false
